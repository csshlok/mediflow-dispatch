global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Used by the prometheus service in docker-compose.yml; targets are compose service names on the internal network
scrape_configs:
  - job_name: medical-emergency-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - user-service:8081
          - emergency-request-service:8082
          - ambulance-service:8083
          - location-service:8084
          - matching-service:8085
          - hospital-service:8086
          - case-service:8087
          - notification-service:8088
